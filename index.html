<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shaw Trust Sittingbourne</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
<header class="bg-[#003865] text-white">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <img src="ShawTrustLogo.png" alt="Shaw Trust Logo" class="h-10" />

        <!-- Hamburger Button (always visible, shown only below 800px via CSS) -->
        <button id="menuButton" class="hamburger w-6 h-5 flex flex-col justify-between focus:outline-none">
            <span class="block h-0.5 bg-white transition-transform duration-300 origin-top-left"></span>
            <span class="block h-0.5 bg-white transition-opacity duration-300"></span>
            <span class="block h-0.5 bg-white transition-transform duration-300 origin-bottom-left"></span>
        </button>

        <!-- Navigation Links (desktop only) -->
        <nav id="desktopNav" class="space-x-6 text-white font-medium hidden">
            <a href="index.html" class="hover:text-gray-300">Home</a>
            <a href="gift-aid.html" class="hover:text-gray-300">Gift Aid</a>
            <a href="collections.html" class="hover:text-gray-300">Collections</a>
            <a href="deliveries.html" class="hover:text-gray-300">Deliveries</a>
        </nav>
    </div>

    <!-- Mobile Menu (only visible on small screens when toggled) -->
    <div id="mobileMenu" class="hidden flex-col bg-[#003865] px-4 pb-4">
        <a href="index.html" class="py-2 text-white border-b border-white/20">Home</a>
        <a href="gift-aid.html" class="py-2 text-white border-b border-white/20">Gift Aid</a>
        <a href="collections.html" class="py-2 text-white border-b border-white/20">Collections</a>
        <a href="deliveries.html" class="py-2 text-white">Deliveries</a>
    </div>
</header>

<main class="py-12 px-4 max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-[#003865] mb-6">Welcome to the Sittingbourne Shaw Trust Website</h1>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <div class="bg-white p-6 rounded shadow text-center">
            <h2 class="text-lg font-semibold text-[#00A9A5] mb-2">🛍️ Donation Status</h2>
            <p id="donation-status">Checking donation status...</p>
        </div>
        <div class="bg-white p-6 rounded shadow text-center">
            <h2 class="text-lg font-semibold text-[#00A9A5] mb-2">🕒 Shop Hours</h2>
            <p id="shop-status">Checking shop status...</p>
        </div>
    </div>
</main>

<footer class="bg-white py-6 mt-12 border-t text-sm text-center text-gray-500">
    &copy; 2025 Shaw Trust - Sittingbourne. All rights reserved. | Registered Charity No. 287785
</footer>

<script>
    const acceptingDonations = true;
    const shopOpenHours = { open: 9, close: 17 };
    const now = new Date();
    const currentHour = now.getHours();
    const isOpen = currentHour >= shopOpenHours.open && currentHour < shopOpenHours.close;
    document.getElementById("shop-status").textContent =
        isOpen ? "🟢 The shop is currently OPEN" : "🔴 The shop is currently CLOSED";
    document.getElementById("donation-status").textContent =
        acceptingDonations ? "✅ We are currently accepting donations!" : "❌ Donations are currently paused.";
</script>
</body>
</html>
