<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gift Aid Registration - Sittingbourne Shaw Trust</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
<header class="bg-[#003865] text-white">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <img src="ShawTrustLogo.png" alt="Shaw Trust Logo" class="h-10" />

        <!-- Hamburger button -->
        <button id="menuButton" class="md:hidden flex flex-col justify-between w-6 h-5 focus:outline-none">
            <span class="block h-0.5 bg-white transition-transform duration-300 origin-top-left"></span>
            <span class="block h-0.5 bg-white transition-opacity duration-300"></span>
            <span class="block h-0.5 bg-white transition-transform duration-300 origin-bottom-left"></span>
        </button>

        <!-- Desktop nav -->
        <nav class="hidden md:flex space-x-6 text-white font-medium">
            <a href="index.html" class="hover:text-gray-300">Home</a>
            <a href="gift-aid.html" class="hover:text-gray-300">Gift Aid</a>
            <a href="collections.html" class="hover:text-gray-300">Collections</a>
            <a href="deliveries.html" class="hover:text-gray-300">Deliveries</a>
        </nav>
    </div>

    <!-- Mobile nav -->
    <div id="mobileMenu" class="md:hidden hidden flex-col bg-[#003865] px-4 pb-4">
        <a href="index.html" class="py-2 text-white border-b border-white/20">Home</a>
        <a href="gift-aid.html" class="py-2 text-white border-b border-white/20">Gift Aid</a>
        <a href="collections.html" class="py-2 text-white border-b border-white/20">Collections</a>
        <a href="deliveries.html" class="py-2 text-white">Deliveries</a>
    </div>
</header>


<main class="py-12 px-4 max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-[#003865] mb-4">Gift Aid Registration</h1>
    <p class="mb-6 text-gray-700">If you're a UK taxpayer, we can claim an extra 25% on your donations at no extra cost to you. Fill in your details to register as a Gift Aider:</p>
    <form id="giftAidForm" class="grid gap-4 bg-white p-6 rounded shadow">
        <input type="text" placeholder="Full Name" class="p-3 border rounded" name="fullname" required />
        <input type="text" placeholder="Address Line" class="p-3 border rounded" name="address" required />

        <input type="text" placeholder="Postcode" class="p-3 border rounded" id="postcode" name="postcode" required />
        <div id="postcodeFeedback" class="text-sm text-red-600 mb-2"></div>

        <input type="email" placeholder="Email Address" class="p-3 border rounded" name="email" required />

        <label class="inline-flex items-center">
            <input type="checkbox" class="mr-2" required />
            I am a UK taxpayer and would like Shaw Trust to claim Gift Aid on my donations.
        </label>

        <button type="submit" class="bg-[#003865] text-white py-2 px-4 rounded hover:bg-[#002B4C]">Register</button>
    </form>
</main>

<footer class="bg-white py-6 mt-12 border-t text-sm text-center text-gray-500">
    &copy; 2025 Shaw Trust - Sittingbourne. All rights reserved.
</footer>
<script src="postcode-validation.js"></script>
</body>
</html>
